name: PhysioNG CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm --filter @physiong/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Build Docker image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://physiong.com -t physiong-mvp:${GITHUB_SHA} .
      - name: Validate Kubernetes production manifests
        run: kubectl kustomize infrastructure/kubernetes/overlays/production >/dev/null
