apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: physiong-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - physiong.com
      secretName: physiong-com-tls
  rules:
    - host: physiong.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: physiong-web
                port:
                  name: http
